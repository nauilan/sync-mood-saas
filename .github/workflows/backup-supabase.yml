name: Backup Supabase (Diário)

# Executa todo dia às 03h BRT (06h UTC)
on:
  schedule:
    - cron: '0 6 * * *'   # 03:00 BRT
  workflow_dispatch:        # Execução manual pelo GitHub

jobs:
  backup:
    name: pg_dump → release privado
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Instala ferramentas ──────────────────────────────────
      - name: Instalar postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      # ── 2. Dump do banco ────────────────────────────────────────
      - name: Fazer pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "15"
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="sync-mood-backup-${TIMESTAMP}.sql.gz"
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV

          DB_HOST="${{ secrets.SUPABASE_DB_HOST }}"
          DB_USER="${{ secrets.SUPABASE_DB_USER }}"
          DB_NAME="${{ secrets.SUPABASE_DB_NAME }}"

          echo "=== Resolvendo IPv4 do host ==="
          IPV4=$(getent ahostsv4 "${DB_HOST}" 2>/dev/null | awk 'NR==1{print $1}')
          if [ -z "${IPV4}" ]; then
            echo "Falha getent, tentando dig..."
            IPV4=$(dig +short -4 "${DB_HOST}" A 2>/dev/null | tail -1)
          fi
          echo "IPv4 resolvido: ${IPV4}"
          export PGHOSTADDR="${IPV4}"

          echo "=== Testando conexão IPv4 ==="
          psql \
            --host="${DB_HOST}" \
            --port=5432 \
            --username="${DB_USER}" \
            --dbname="${DB_NAME}" \
            -c "SELECT version();" 2>&1 || echo "psql test falhou (ver acima)"

          echo "=== Iniciando dump ==="
          pg_dump \
            --host="${DB_HOST}" \
            --port=5432 \
            --username="${DB_USER}" \
            --dbname="${DB_NAME}" \
            --no-owner \
            --no-acl \
            --format=plain \
            --file="dump_raw.sql" 2>&1
          DUMP_EXIT=$?

          echo "pg_dump exit: ${DUMP_EXIT}"
          echo "Linhas: $(wc -l < dump_raw.sql 2>/dev/null || echo 0)"

          if [ "${DUMP_EXIT}" -ne 0 ]; then
            echo "ERRO: pg_dump falhou com exit ${DUMP_EXIT}"
            exit 1
          fi

          gzip -c dump_raw.sql > "${FILENAME}"
          echo "Dump comprimido: $(ls -lh ${FILENAME})"

          echo "Tamanho do dump:"
          ls -lh "${FILENAME}"

      # ── 3. Upload como artifact (7 dias de retenção) ───────────
      - name: Salvar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 7

      # ── 4. Verifica integridade mínima ─────────────────────────
      - name: Verificar dump
        run: |
          SIZE=$(stat -c%s "${{ env.FILENAME }}")
          echo "Tamanho: ${SIZE} bytes"
          # Descomprime 1 linha para checar que é SQL válido
          FIRST=$(zcat "${{ env.FILENAME }}" | head -1 || true)
          echo "Primeira linha: ${FIRST}"
          if [ "${SIZE}" -lt 50 ]; then
            echo "ERRO: dump muito pequeno (${SIZE} bytes), possível falha."
            exit 1
          fi
          echo "Backup OK: ${{ env.FILENAME }}"

# ── CONFIGURAÇÃO NECESSÁRIA (Secrets no GitHub) ─────────────────
#
# Settings → Secrets and variables → Actions → New repository secret:
#
#   SUPABASE_DB_HOST     → db.<project-ref>.supabase.co
#   SUPABASE_DB_PASSWORD → senha do usuário postgres
#                          (Supabase Dashboard → Settings → Database → Database password)
#
# COMO OBTER O HOST:
#   Supabase Dashboard → Settings → Database → Connection string
#   Exemplo: db.abcdefghijklmnop.supabase.co
#
# RECOMENDADO — backup externo adicional no Cloudflare R2 ou AWS S3:
#   Adicionar step com aws-cli ou rclone após o step 2.
#   Exemplo (R2):
#     rclone copy "${FILENAME}" r2:sync-mood-backups/
