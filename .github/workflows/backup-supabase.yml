name: Backup Supabase (Diário)

# Executa todo dia às 03h BRT (06h UTC)
on:
  schedule:
    - cron: '0 6 * * *'   # 03:00 BRT
  workflow_dispatch:        # Execução manual pelo GitHub

jobs:
  backup:
    name: export → artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout (para ter node e scripts) ──────────────────────
      - uses: actions/checkout@v4

      # ── 2. Setup Node.js ───────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Exportar dados via REST API (HTTPS / IPv4) ───────────────
      # O host direto (db.*.supabase.co) tem apenas IPv6 e GitHub Actions
      # não tem rota IPv6 para essa faixa AWS. Usamos a API REST do
      # Supabase (HTTPS) com service_role_key para exportar todos os dados.
      - name: Exportar dados Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="backup_${TIMESTAMP}"
          mkdir -p "${BACKUP_DIR}"
          echo "BACKUP_DIR=${BACKUP_DIR}" >> $GITHUB_ENV
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

          # Lista de tabelas a exportar
          TABLES="titulares editoras negocios_editoriais contratos obras fonogramas \
                  obras_participantes obras_links obras_links_titulares \
                  recebimentos distribuicoes cc_obras cc_titulares prestacao_contas \
                  audit_logs usuarios tenants importacoes_log"

          TOTAL=0
          FAILED=0

          for TABLE in ${TABLES}; do
            echo -n "Exportando ${TABLE}... "
            HTTP_CODE=$(curl -s -o "${BACKUP_DIR}/${TABLE}.json" -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/${TABLE}?select=*" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Accept: application/json" \
              -H "Prefer: count=none")

            if [ "${HTTP_CODE}" = "200" ]; then
              ROWS=$(python3 -c "import json,sys; d=json.load(open('${BACKUP_DIR}/${TABLE}.json')); print(len(d) if isinstance(d,list) else 'N/A')" 2>/dev/null || echo "?")
              echo "OK (${ROWS} linhas, HTTP ${HTTP_CODE})"
              TOTAL=$((TOTAL + 1))
            else
              echo "FALHOU (HTTP ${HTTP_CODE})"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=== Resumo ==="
          echo "Tabelas exportadas: ${TOTAL}"
          echo "Falhas: ${FAILED}"

          # Metadata do backup
          cat > "${BACKUP_DIR}/backup_info.json" << EOF
          {
            "timestamp": "${TIMESTAMP}",
            "project_ref": "tigubwxotanaznqqxogf",
            "tabelas_exportadas": ${TOTAL},
            "falhas": ${FAILED},
            "method": "supabase-rest-api"
          }
          EOF

          # Verifica se exportou ao menos as tabelas críticas
          if [ ! -s "${BACKUP_DIR}/titulares.json" ] || [ ! -s "${BACKUP_DIR}/contratos.json" ]; then
            echo "ERRO: tabelas críticas não exportadas"
            exit 1
          fi

          echo "Backup OK: ${BACKUP_DIR}"

      # ── 4. Comprimir ────────────────────────────────────────────────
      - name: Comprimir backup
        run: |
          FILENAME="sync-mood-backup-${TIMESTAMP}.tar.gz"
          tar -czf "${FILENAME}" "${BACKUP_DIR}/"
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV
          echo "Arquivo: $(ls -lh ${FILENAME})"

      # ── 5. Upload como artifact (7 dias de retenção) ───────────────
      - name: Salvar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.TIMESTAMP }}
          path: ${{ env.FILENAME }}
          retention-days: 7

      # ── 6. Verifica integridade ────────────────────────────────────
      - name: Verificar backup
        run: |
          SIZE=$(stat -c%s "${{ env.FILENAME }}")
          echo "Tamanho: ${SIZE} bytes"
          if [ "${SIZE}" -lt 200 ]; then
            echo "ERRO: backup muito pequeno (${SIZE} bytes)"
            exit 1
          fi
          echo "Backup salvo: ${{ env.FILENAME }} (${SIZE} bytes)"

# ── SECRETS NECESSÁRIOS (GitHub → Settings → Secrets → Actions) ─────
#
#   SUPABASE_URL             → https://tigubwxotanaznqqxogf.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY → chave service_role (Supabase → Settings → API)
#
# NOTA: O backup pg_dump direto não funciona porque db.*.supabase.co
# tem apenas endereço IPv6 e o runner GitHub Actions (Azure) não tem
# rota IPv6 para a faixa AWS usada. Solução: habilitar IPv4 add-on
# no Supabase (Settings → Add-ons) e atualizar para pg_dump novamente.
