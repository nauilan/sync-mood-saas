# ════════════════════════════════════════════════════════════
#  Deploy — Sync Mood
#  Pipeline completo: typecheck → unit tests → isolation tests → deploy
#  REGRA: deploy só acontece se TODOS os testes passarem.
#
#  GitHub Secrets necessários:
#    VERCEL_TOKEN                — token da Vercel CLI
#    NEXT_PUBLIC_SUPABASE_URL    — URL do projeto Supabase
#    NEXT_PUBLIC_SUPABASE_ANON_KEY — chave anon
#    SUPABASE_SERVICE_ROLE_KEY   — chave service_role
# ════════════════════════════════════════════════════════════
name: CI + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # nunca cancela um deploy em andamento

jobs:

  # ── 1. TypeScript ──────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # ── 2. Testes unitários ────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx vitest run --exclude '**/__tests__/isolation/**'

  # ── 3. Testes de isolamento multi-tenant ──────────────────
  isolation-tests:
    name: Multi-tenant isolation
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      NEXT_PUBLIC_SUPABASE_URL:     ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Start production server
        run: nohup npm run start > /tmp/nextjs.log 2>&1 &

      - name: Wait for server
        run: |
          echo "Waiting for Next.js server..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready (try ${i})"
              exit 0
            fi
            sleep 3
          done
          echo "=== Server failed to start. Logs: ==="
          cat /tmp/nextjs.log
          exit 1

      - name: Run isolation tests
        run: npm run test:isolation
        env:
          ISOLATION_TEST_API_URL: http://localhost:3000

  # ── 4. Deploy para Vercel (só se tudo passar) ──────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: isolation-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create Vercel project config
        run: |
          mkdir -p apps/web/.vercel
          echo '{"projectId":"prj_81eomK8Uie2j1dPv0mIbJEgbn4Eg","orgId":"team_oSlrnl2yyOTFvhvjIgtBZan7"}' > apps/web/.vercel/project.json

      - name: Deploy to Production
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
