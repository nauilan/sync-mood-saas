# ════════════════════════════════════════════════════════════
#  Deploy — Sync Mood
#  Pipeline: typecheck → unit tests → deploy → isolation tests
#
#  Os isolation tests rodam APÓS o deploy, contra a Vercel.
#  Isso elimina o servidor local frágil em CI.
#  Se isolamento falhar, o commit é sinalizado como falho (visível
#  no PR/branch), mas o artefato já está na Vercel para debug.
#
#  GitHub Secrets necessários:
#    VERCEL_TOKEN                  — token da Vercel CLI
#    NEXT_PUBLIC_SUPABASE_URL      — URL do projeto Supabase
#    NEXT_PUBLIC_SUPABASE_ANON_KEY — chave anon (JWT eyJ...)
#    SUPABASE_SERVICE_ROLE_KEY     — chave service_role (JWT eyJ...)
# ════════════════════════════════════════════════════════════
name: CI + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── 1. TypeScript ──────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # ── 2. Testes unitários ────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx vitest run --exclude '**/__tests__/isolation/**'
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── 3. Deploy para Vercel ──────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      vercel_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create Vercel project config
        run: |
          mkdir -p apps/web/.vercel
          echo '{"projectId":"prj_81eomK8Uie2j1dPv0mIbJEgbn4Eg","orgId":"team_oSlrnl2yyOTFvhvjIgtBZan7"}' > apps/web/.vercel/project.json

      - name: Deploy to Production
        id: deploy
        run: |
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel.log
          echo "url=https://sync-mood-saas.vercel.app" >> $GITHUB_OUTPUT
        working-directory: apps/web

  # ── 4. Isolation tests contra a Vercel (pós-deploy) ───────
  isolation-tests:
    name: Multi-tenant isolation
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci

      - name: Aguardar Vercel pronto
        run: |
          echo "Verificando se a Vercel está respondendo..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sync-mood-saas.vercel.app/api/me || true)
            if [ "$STATUS" != "000" ]; then
              echo "Vercel respondeu com HTTP $STATUS (try ${i})"
              exit 0
            fi
            sleep 5
          done
          echo "Vercel não respondeu. Abortando."
          exit 1

      - name: Run isolation tests
        run: npm run test:isolation
        env:
          ISOLATION_TEST_API_URL:        https://sync-mood-saas.vercel.app
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
