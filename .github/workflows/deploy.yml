name: CI + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx vitest run --exclude '**/__tests__/isolation/**'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: apps/web
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Create Vercel project config
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_81eomK8Uie2j1dPv0mIbJEgbn4Eg","orgId":"team_oSlrnl2yyOTFvhvjIgtBZan7"}' > .vercel/project.json
      - name: Deploy preview
        id: deploy
        run: |
          vercel --yes --token=${{ secrets.VERCEL_TOKEN }} > vercel-output.txt
          PREVIEW_URL=$(grep -Eo 'https://[^ ]+\.vercel\.app' vercel-output.txt | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            cat vercel-output.txt
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

  isolation-tests:
    name: Isolation tests
    runs-on: ubuntu-latest
    needs: deploy-preview
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Aguardar preview pronto
        run: |
          BYPASS_HEADER=()
          if [ -n "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" ]; then
            BYPASS_HEADER=(-H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}")
          fi
          for i in $(seq 1 24); do
            BODY=$(curl -sS -L --max-redirs 0 "${BYPASS_HEADER[@]}" "${{ needs.deploy-preview.outputs.preview_url }}/api/health" || true)
            if echo "$BODY" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'; then echo "OK (health JSON, try $i)"; exit 0; fi
            HEADERS=$(curl -sSI --max-redirs 0 "${BYPASS_HEADER[@]}" "${{ needs.deploy-preview.outputs.preview_url }}/api/health" || true)
            if echo "$HEADERS" | grep -qi '^[Ll]ocation: https://vercel.com/sso-api'; then
              echo "Preview protegido pela Vercel Preview Protection."
              echo "Configure o secret VERCEL_AUTOMATION_BYPASS_SECRET no GitHub Actions para liberar a automação."
              exit 1
            fi
            if echo "$BODY" | grep -qi '<!DOCTYPE html>\|<html'; then
              echo "Preview não está expondo API JSON. Recebido HTML 200 em /api/health."
              echo "Verificar Vercel preview protection, root directory ou URL de deploy."
              exit 1
            fi
            sleep 5
          done
          echo "Preview nao respondeu com JSON válido em /api/health."
          exit 1
      - name: Run isolation tests
        run: npm run test:isolation
        env:
          ISOLATION_TEST_API_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  editorial-e2e:
    name: Editorial E2E
    runs-on: ubuntu-latest
    needs: isolation-tests
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Run editorial E2E
        run: npm run test:editorial-e2e
        env:
          ISOLATION_TEST_API_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  promote-production:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: editorial-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Create Vercel project config
        run: |
          mkdir -p apps/web/.vercel
          echo '{"projectId":"prj_81eomK8Uie2j1dPv0mIbJEgbn4Eg","orgId":"team_oSlrnl2yyOTFvhvjIgtBZan7"}' > apps/web/.vercel/project.json
      - name: Deploy to Production
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web