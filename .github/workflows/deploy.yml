# ════════════════════════════════════════════════════════════
#  Deploy — Sync Mood
#
#  GATE REAL DE PRODUÇÃO (Opção B):
#    1. typecheck
#    2. unit-tests
#    3. deploy-preview   → Vercel preview (NÃO é produção ainda)
#    4. isolation-tests  → contra preview URL (bloqueia se falhar)
#    5. promote          → só após isolation verde, promove para prod
#
#  GitHub Secrets necessários:
#    VERCEL_TOKEN                  — token da Vercel CLI
#    NEXT_PUBLIC_SUPABASE_URL      — URL do projeto Supabase
#    NEXT_PUBLIC_SUPABASE_ANON_KEY — chave anon (JWT eyJ...)
#    SUPABASE_SERVICE_ROLE_KEY     — chave service_role (JWT eyJ...)
# ════════════════════════════════════════════════════════════
name: CI + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── 1. TypeScript ──────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # ── 2. Testes unitários ────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx vitest run --exclude '**/__tests__/isolation/**'
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── 3. Deploy PREVIEW (não é produção) ─────────────────────
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create Vercel project config
        run: |
          mkdir -p apps/web/.vercel
          echo '{"projectId":"prj_81eomK8Uie2j1dPv0mIbJEgbn4Eg","orgId":"team_oSlrnl2yyOTFvhvjIgtBZan7"}' > apps/web/.vercel/project.json

      - name: Deploy to preview (sem --prod)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -E "https://sync-mood-saas-[a-z0-9-]+\.vercel\.app" | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            # fallback: pega qualquer URL vercel.app da saída
            DEPLOY_URL=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -E "https://[^ ]+\.vercel\.app" | tail -1 || echo "https://sync-mood-saas.vercel.app")
          fi
          echo "Preview URL: $DEPLOY_URL"
          echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        working-directory: apps/web

  # ── 4. Isolation tests contra PREVIEW ─────────────────────
  #       Se falhar aqui, produção NÃO recebe o deploy.
  isolation-tests:
    name: Multi-tenant isolation (gate)
    runs-on: ubuntu-latest
    needs: deploy-preview
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci

      - name: Aguardar preview pronto
        run: |
          TARGET="${{ needs.deploy-preview.outputs.preview_url }}"
          echo "Aguardando: $TARGET"
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET/api/me" || true)
            if [ "$STATUS" != "000" ]; then
              echo "Preview respondeu HTTP $STATUS (tentativa $i)"
              exit 0
            fi
            sleep 5
          done
          echo "Preview não respondeu em 120s."
          exit 1

      - name: Run isolation tests
        run: npm run test:isolation
        env:
          ISOLATION_TEST_API_URL:        ${{ needs.deploy-preview.outputs.preview_url }}
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── 5. Promote para PRODUÇÃO (só após isolation verde) ─────
  promote:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: [deploy-preview, isolation-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create Vercel project config
        run: |
          mkdir -p apps/web/.vercel
          echo '{"projectId":"prj_81eomK8Uie2j1dPv0mIbJEgbn4Eg","orgId":"team_oSlrnl2yyOTFvhvjIgtBZan7"}' > apps/web/.vercel/project.json

      - name: Promote preview to production
        run: |
          vercel promote "${{ needs.deploy-preview.outputs.preview_url }}" \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes
        working-directory: apps/web
